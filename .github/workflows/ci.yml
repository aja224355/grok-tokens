name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build & test
        shell: bash
        run: |
          cargo test --target ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
          cargo run --release --target ${{ matrix.target }} -- --version
          cargo run --release --target ${{ matrix.target }} -- --help

  npm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check installer scripts
        run: |
          node --check npm/lib.js
          node --check npm/install.js
          node --check npm/cli.js
          node npm/lib.js
