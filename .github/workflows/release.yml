name: Release

# Tag and push:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Assets:
#   grok-tokens-<triple>.tar.gz   native binaries (linux musl/gnu, mac, windows)
#   install.sh / install.ps1      one-line installers for other machines

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
            bin: grok-tokens
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
            bin: grok-tokens
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            bin: grok-tokens
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            bin: grok-tokens
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            bin: grok-tokens
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            bin: grok-tokens.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (musl)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$BIN"
          "$BIN" --version || true
          tar -czf "grok-tokens-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-tokens-${{ matrix.target }}
          path: grok-tokens-${{ matrix.target }}.tar.gz

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: find dist -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            install.sh
            install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
